    </linearGradient>
    <linearGradient id="petalPinkInner" x1="60" y1="15" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2F7"/>
      <stop offset="60%" stop-color="#F7C6D9"/>
      <stop offset="100%" stop-color="#E290B5"/>
