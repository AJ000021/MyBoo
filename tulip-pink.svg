<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" fill="none">
  <defs>
    <linearGradient id="stemPink" x1="60" y1="95" x2="60" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8BAE8A"/>
      <stop offset="100%" stop-color="#608462"/>
    </linearGradient>
    <linearGradient id="leafPink" x1="30" y1="130" x2="70" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9BC19A" stop-opacity="0.9"/>
